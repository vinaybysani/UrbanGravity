<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <linearGradient id="orbitGradBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Card Background -->
  <rect width="920" height="260" rx="24" fill="url(#bgBanner)" stroke="#1F2937" stroke-width="2" />

  <!-- Subtle Top Accent Glow Line -->
  <rect x="0" y="0" width="920" height="4" fill="url(#accentGrad)" />

  <!-- Background Spatial Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="260" />
    <line x1="160" y1="0" x2="160" y2="260" />
    <line x1="280" y1="0" x2="280" y2="260" />
    <line x1="400" y1="0" x2="400" y2="260" />
    <line x1="520" y1="0" x2="520" y2="260" />
    <line x1="640" y1="0" x2="640" y2="260" />
    <line x1="760" y1="0" x2="760" y2="260" />
    <line x1="880" y1="0" x2="880" y2="260" />
    <line x1="0" y1="65" x2="920" y2="65" />
    <line x1="0" y1="130" x2="920" y2="130" />
    <line x1="0" y1="195" x2="920" y2="195" />
  </g>

  <!-- Left Icon Emblem Container (Center at X=140, Y=130) -->
  <g transform="translate(40, 25)">
    <!-- Back Orbit Ring -->
    <path d="M 25 140 C 15 90, 80 50, 160 65 C 200 72, 220 95, 210 115"
          fill="none" stroke="url(#orbitGradBanner)" stroke-width="5" stroke-linecap="round"
          opacity="0.5" filter="url(#glowBanner)" />

    <!-- Left Building -->
    <rect x="65" y="105" width="38" height="95" rx="5" fill="#0284C7" />
    <g fill="#E0F2FE" opacity="0.8">
      <rect x="73" y="115" width="8" height="7" rx="1.5" />
      <rect x="87" y="115" width="8" height="7" rx="1.5" />
      <rect x="73" y="128" width="8" height="7" rx="1.5" />
      <rect x="87" y="128" width="8" height="7" rx="1.5" />
      <rect x="73" y="141" width="8" height="7" rx="1.5" />
      <rect x="87" y="141" width="8" height="7" rx="1.5" />
      <rect x="73" y="154" width="8" height="7" rx="1.5" />
      <rect x="87" y="154" width="8" height="7" rx="1.5" />
    </g>

    <!-- Right Building -->
    <rect x="150" y="90" width="42" height="110" rx="5" fill="#7C3AED" />
    <polygon points="150,90 171,70 192,90" fill="#9333EA" />
    <g fill="#F3E8FF" opacity="0.8">
      <rect x="158" y="102" width="10" height="8" rx="1.5" />
      <rect x="174" y="102" width="10" height="8" rx="1.5" />
      <rect x="158" y="117" width="10" height="8" rx="1.5" />
      <rect x="174" y="117" width="10" height="8" rx="1.5" />
      <rect x="158" y="132" width="10" height="8" rx="1.5" />
      <rect x="174" y="132" width="10" height="8" rx="1.5" />
      <rect x="158" y="147" width="10" height="8" rx="1.5" />
      <rect x="174" y="147" width="10" height="8" rx="1.5" />
    </g>

    <!-- Center Gravitational Tower -->
    <rect x="105" y="60" width="48" height="140" rx="6" fill="#4F46E5" />
    <line x1="129" y1="60" x2="129" y2="35" stroke="#818CF8" stroke-width="3" stroke-linecap="round" />
    <circle cx="129" cy="32" r="5" fill="#EF4444" filter="url(#glowBanner)" />

    <g fill="#FEF08A" opacity="0.9">
      <rect x="113" y="75" width="8" height="7" rx="1.5" />
      <rect x="125" y="75" width="8" height="7" rx="1.5" />
      <rect x="137" y="75" width="8" height="7" rx="1.5" />
      <rect x="113" y="90" width="8" height="7" rx="1.5" />
      <rect x="125" y="90" width="8" height="7" rx="1.5" />
      <rect x="137" y="90" width="8" height="7" rx="1.5" />
      <rect x="113" y="105" width="8" height="7" rx="1.5" />
      <rect x="125" y="105" width="8" height="7" rx="1.5" />
      <rect x="137" y="105" width="8" height="7" rx="1.5" />
      <rect x="113" y="120" width="8" height="7" rx="1.5" />
      <rect x="125" y="120" width="8" height="7" rx="1.5" />
      <rect x="137" y="120" width="8" height="7" rx="1.5" />
      <rect x="113" y="135" width="8" height="7" rx="1.5" />
      <rect x="125" y="135" width="8" height="7" rx="1.5" />
      <rect x="137" y="135" width="8" height="7" rx="1.5" />
    </g>

    <!-- Front Orbit Ring -->
    <path d="M 210 115 C 200 155, 120 185, 50 170 C 20 164, 15 150, 25 140"
          fill="none" stroke="url(#orbitGradBanner)" stroke-width="6" stroke-linecap="round"
          filter="url(#glowBanner)" />

    <!-- Orbital Particles -->
    <circle cx="185" cy="145" r="8" fill="#F59E0B" filter="url(#glowBanner)" />
    <circle cx="185" cy="145" r="4" fill="#FFFFFF" />
    <circle cx="45" cy="165" r="6" fill="#38BDF8" />

    <!-- Ground base -->
    <rect x="40" y="200" width="175" height="8" rx="4" fill="#1E293B" />
  </g>

  <!-- Typography & Text Hierarchy -->
  <g transform="translate(290, 80)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-weight="900" font-size="48" letter-spacing="2" fill="#FFFFFF">
      URBAN<tspan fill="#F59E0B">GRAVITY</tspan>
    </text>

    <!-- Tagline Badge -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="310" height="28" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
      <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-weight="700" font-size="12" letter-spacing="1.5" fill="#818CF8">
        🏙️ 🧲 SPATIAL CAPITAL & AFFLUENCE INTELLIGENCE
      </text>
    </g>

    <!-- Sub-description -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="400" font-size="14.5" fill="#9CA3AF">
      Quantitative commercial tier evaluation, discretionary spending pull,
    </text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-weight="400" font-size="14.5" fill="#9CA3AF">
      and real-time demographic micro-market stratification for Indian metros.
    </text>
  </g>
</svg>

